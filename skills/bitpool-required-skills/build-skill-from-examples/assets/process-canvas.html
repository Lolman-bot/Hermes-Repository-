<!doctype html>
<!-- process-canvas.html — used two ways by scripts/canvas_server.py:
     served:     the server hands it /seed.json and /mermaid.min.js and takes the diagram at /submit.
     standalone: --standalone inlines Mermaid and the seed into one self-contained file; Submit is
                 hidden and the person copies or downloads the diagram instead.
     Opening this raw file directly does not work: it has neither the library nor the seed. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw your process</title>
<style>
:root{--bg:#f7f8fa;--s2:#ffffff;--b:#d6dae1;--t:#1b1f24;--t2:#5b6470;--acc:#0aa5c8;--err:#c62828;--ok:#2e7d32}
@media (prefers-color-scheme: dark){:root{--bg:#14171b;--s2:#1d2126;--b:#343a42;--t:#e8eaed;--t2:#9aa3ad;--err:#ef6c6c;--ok:#7bc67e}}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.lede{color:var(--t2);margin:0 0 8px}
input,select,button{font:inherit;color:inherit;background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
#mb-submit{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.done{border:1px solid var(--ok);border-radius:12px;padding:16px;margin-top:16px}
.mb-card{border:0.5px solid var(--b);border-radius:12px;background:var(--s2);padding:12px 14px;margin-top:12px}
.mb-h{font-size:14px;font-weight:500;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.mb-row{display:grid;gap:8px;align-items:center;margin-bottom:8px}
.mb-node{grid-template-columns:minmax(0,1fr) 130px 36px}
.mb-link{grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr) minmax(0,0.8fr) 36px}
.mb-row input,.mb-row select{width:100%;min-width:0;box-sizing:border-box}
.mb-x{padding:0;width:36px;height:36px}
.mb-arrow{color:var(--t2);text-align:center}
.mb-hint{font-size:13px;color:var(--t2);margin:0}
#mb-out{display:flex;justify-content:center;overflow-x:auto;min-height:220px}
#mb-out svg{max-width:100%;height:auto}
.mb-big #mb-out{min-height:520px}
.mb-big #mb-out svg{min-height:480px}
.mb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mb-err{font-size:13px;color:var(--err)}
.mb-ok{font-size:13px;color:var(--ok)}
</style></head>
<body><main>
<h1>Draw your process</h1>
<p class="lede">Show how the work gets from what arrives to what's finished. Add boxes, name them, and link them up. When you're happy, press <strong>Submit diagram</strong>, then go back to Hermes and say you're done.</p>
<div id="mb-root">
  <div class="mb-card">
    <p class="mb-h"><span>Boxes</span><button id="mb-addnode">+ Add box</button></p>
    <div id="mb-nodes"></div>
  </div>
  <div class="mb-card">
    <p class="mb-h"><span>Links</span><button id="mb-addlink">+ Add link</button></p>
    <div id="mb-links"></div>
  </div>
  <div class="mb-card">
    <p class="mb-h"><span>Preview</span><button id="mb-size">Bigger preview</button></p>
    <div id="mb-out"></div>
  </div>
  <div class="mb-bar">
    <button id="mb-submit">Submit diagram</button>
    <button id="mb-copy">Copy diagram</button>
    <button id="mb-download" hidden>Download diagram</button>
    <span id="mb-msg"></span>
  </div>
</div>
<div id="mb-done"></div>
</main>
<script src="/mermaid.min.js"></script>
<script>
const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({startOnLoad:false,theme:dark?'dark':'neutral',securityLevel:'strict'});
const $=id=>document.getElementById(id);
let nodes=[{id:'n1',label:'Work arrives',shape:'round'},{id:'n2',label:'First step',shape:'box'},{id:'n3',label:'Finished work sent',shape:'round'}];
let links=[{from:'n1',to:'n2',label:''},{from:'n2',to:'n3',label:''}];
function loadSeed(s){if(s&&Array.isArray(s.nodes)&&s.nodes.length){nodes=s.nodes.map(n=>({id:String(n.id),label:String(n.label||''),shape:['box','decision','round'].includes(n.shape)?n.shape:'box'}));links=(s.links||[]).map(l=>({from:String(l.from),to:String(l.to),label:String(l.label||'')}));}}
function nextSeq(){return nodes.reduce((m,n)=>{const k=parseInt(String(n.id).replace(/\D/g,''),10);return isNaN(k)?m:Math.max(m,k);},0)+1;}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const clean=s=>String(s).replace(/["\[\]{}()|<>]/g,"'").trim();
function renderNodes(){
  $('mb-nodes').innerHTML=nodes.map((n,i)=>`<div class="mb-row mb-node"><input data-i="${i}" data-f="label" value="${esc(n.label)}" placeholder="What happens here" aria-label="Box name"><select data-i="${i}" data-f="shape" aria-label="Box shape"><option value="box"${n.shape==='box'?' selected':''}>Step</option><option value="decision"${n.shape==='decision'?' selected':''}>Question</option><option value="round"${n.shape==='round'?' selected':''}>Start or end</option></select><button class="mb-x" data-delnode="${i}" aria-label="Remove box">✕</button></div>`).join('')||'<p class="mb-hint">Add a box to get started.</p>';
}
function opts(sel){return nodes.map(n=>`<option value="${n.id}"${n.id===sel?' selected':''}>${esc(n.label||'Untitled')}</option>`).join('');}
function renderLinks(){
  $('mb-links').innerHTML=links.map((l,i)=>`<div class="mb-row mb-link"><select data-j="${i}" data-f="from" aria-label="From">${opts(l.from)}</select><span class="mb-arrow">→</span><select data-j="${i}" data-f="to" aria-label="To">${opts(l.to)}</select><input data-j="${i}" data-f="label" value="${esc(l.label)}" placeholder="Label (optional)" aria-label="Link label"><button class="mb-x" data-dellink="${i}" aria-label="Remove link">✕</button></div>`).join('')||'<p class="mb-hint">Links join two boxes with an arrow.</p>';
}
function code(){
  const L=['flowchart TD'];
  nodes.forEach(n=>{const t=clean(n.label)||'Untitled';L.push(n.shape==='decision'?`    ${n.id}{"${t}"}`:n.shape==='round'?`    ${n.id}(["${t}"])`:`    ${n.id}["${t}"]`);});
  links.filter(l=>nodes.some(n=>n.id===l.from)&&nodes.some(n=>n.id===l.to)).forEach(l=>{const t=clean(l.label);L.push(t?`    ${l.from} -->|"${t}"| ${l.to}`:`    ${l.from} --> ${l.to}`);});
  return L.join('\n');
}
let rn=0,timer;
async function draw(){
  if(!nodes.length){$('mb-out').innerHTML='';return;}
  try{const r=await mermaid.render('mbr'+(rn++),code());$('mb-out').innerHTML=r.svg;}catch(e){document.querySelectorAll('[id^="dmbr"]').forEach(x=>x.remove());}
}
function soon(){clearTimeout(timer);timer=setTimeout(draw,250);}
function say(t,ok){const m=$('mb-msg');m.textContent=t;m.className=ok?'mb-ok':'mb-err';}
function ready(){
  if(!nodes.length){say('Add at least one box first.');return false;}
  if(nodes.some(n=>!n.label.trim())){say('Give every box a name first.');return false;}
  return true;
}
async function copyDiagram(){
  if(!ready())return;
  const t='```mermaid\n'+code()+'\n```';
  try{await navigator.clipboard.writeText(t);say('Copied. Paste it into the chat.',true);}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');say('Copied. Paste it into the chat.',true);}catch(_){say("Couldn't copy automatically. Select the text below and copy it.");}a.remove();}
}
function wire(onSubmit){
  let seq=nextSeq();
  $('mb-nodes').addEventListener('input',e=>{const i=e.target.dataset.i;if(i===undefined)return;nodes[i][e.target.dataset.f]=e.target.value;say('');if(e.target.dataset.f==='label'){clearTimeout(window.lt);window.lt=setTimeout(renderLinks,500);}soon();});
  $('mb-nodes').addEventListener('change',e=>{const i=e.target.dataset.i;if(i!==undefined){nodes[i][e.target.dataset.f]=e.target.value;soon();}});
  $('mb-nodes').addEventListener('click',e=>{const b=e.target.closest('[data-delnode]');if(!b)return;const id=nodes[b.dataset.delnode].id;nodes.splice(b.dataset.delnode,1);links=links.filter(l=>l.from!==id&&l.to!==id);renderNodes();renderLinks();draw();});
  $('mb-links').addEventListener('input',e=>{const j=e.target.dataset.j;if(j===undefined)return;links[j][e.target.dataset.f]=e.target.value;soon();});
  $('mb-links').addEventListener('change',e=>{const j=e.target.dataset.j;if(j!==undefined){links[j][e.target.dataset.f]=e.target.value;soon();}});
  $('mb-links').addEventListener('click',e=>{const b=e.target.closest('[data-dellink]');if(!b)return;links.splice(b.dataset.dellink,1);renderLinks();draw();});
  $('mb-addnode').addEventListener('click',()=>{const id='n'+(seq++);const prev=nodes[nodes.length-1];nodes.push({id,label:'New step',shape:'box'});if(prev)links.push({from:prev.id,to:id,label:''});renderNodes();renderLinks();draw();const ins=$('mb-nodes').querySelectorAll('input');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select();}});
  $('mb-addlink').addEventListener('click',()=>{if(nodes.length<2){say('Add at least two boxes before linking them.');return;}links.push({from:nodes[0].id,to:nodes[1].id,label:''});renderLinks();draw();});
  $('mb-size').addEventListener('click',()=>{const big=$('mb-root').classList.toggle('mb-big');$('mb-size').textContent=big?'Smaller preview':'Bigger preview';});
  $('mb-copy').addEventListener('click',copyDiagram);
  $('mb-submit').addEventListener('click',()=>{if(ready())onSubmit(code());});
  renderNodes();renderLinks();draw();
}

(async()=>{
  if(window.CANVAS_STANDALONE){
    loadSeed(window.CANVAS_SEED);
    $('mb-submit').hidden=true;$('mb-download').hidden=false;
    document.querySelector('.lede').innerHTML="Show how the work gets from what arrives to what's finished. Add boxes, name them, and link them up. When you're happy, press <strong>Copy diagram</strong> and paste it into your chat with Hermes, or press <strong>Download diagram</strong> and send Hermes the file.";
    $('mb-download').addEventListener('click',()=>{if(!ready())return;const b=new Blob([code()+'\n'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='process.mmd';document.body.appendChild(a);a.click();a.remove();say('Downloaded process.mmd. Send it to Hermes in the chat.',true);});
    wire(()=>{});
    return;
  }
  try{const r=await fetch('/seed.json');if(r.ok)loadSeed(await r.json());}catch(e){}
  wire(async c=>{
    try{
      const r=await fetch('/submit',{method:'POST',headers:{'Content-Type':'text/plain'},body:c});
      if(!r.ok)throw new Error(r.status);
      document.getElementById('mb-root').style.display='none';
      document.getElementById('mb-done').innerHTML='<div class="done"><strong>Diagram saved.</strong> Go back to Hermes and say you\'re done. You can close this tab.</div>';
    }catch(e){say("Couldn't reach the canvas helper. Press Copy diagram and paste it into the chat instead.");}
  });
})();
</script>
</body></html>
